  # ===========================================================================
  # OUTILS (profil "tools" : docker compose --profile tools up)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medplatform-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [medplatform]

networks:
  medplatform:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
